name: Release

# Builds the desktop installers for macOS, Windows and Linux when a version tag
# is pushed, and attaches them to a *draft* GitHub Release with SHA-256 sums.
# The draft is the approval step: download, test, then press "Publish release".
#
#   python scripts/version.py set 1.0.1 && git commit -am "Release 1.0.1"
#   git tag v1.0.1 && git push origin main v1.0.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v1.0.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: python3 scripts/version.py check --tag "$TAG"

  desktop:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # 22.04 rather than 24.04: an older glibc runs on more distributions.
          - os: ubuntu-22.04
            label: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the backend sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ".[keychain]" "pyinstaller>=6.10" pillow
          python packaging/backend/build_sidecar.py --target ${{ matrix.target }}

      - name: Smoke-test the sidecar
        shell: bash
        run: |
          suffix=""; [[ "${{ matrix.target }}" == *windows* ]] && suffix=".exe"
          python packaging/backend/smoke_test.py "apps/desktop/src-tauri/binaries/privia-backend-${{ matrix.target }}${suffix}"

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install the UI and draw the icons
        shell: bash
        run: |
          (cd apps/desktop && npm ci --no-audit --no-fund)
          python scripts/make_icons.py

      - name: Optional code signing
        # Without these secrets the installers are unsigned. See docs/RELEASING.md.
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_CERTIFICATE" ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              {
                echo "$name<<__EOF__"
                printenv "$name"
                echo "__EOF__"
              } >> "$GITHUB_ENV"
            done
            echo "Signing and notarizing with the configured Apple identity."
          else
            echo "No signing secrets: building unsigned installers."
          fi

      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: python packaging/collect_artifacts.py --label ${{ matrix.label }} --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Draft the GitHub Release
    needs: desktop
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to
    # make publishing a draft need an explicit approval as well.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum PRIVIA-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release, or attach to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Created on GitHub's web page (which also creates the tag), or a
            # rebuild of an existing tag: replace the installers, keep the text.
            echo "Release $TAG exists; attaching the installers to it."
            gh release upload "$TAG" release/* --clobber
            exit 0
          fi
          notes="docs/releases/${TAG}.md"
          [[ -f "$notes" ]] || notes="docs/releases/TEMPLATE.md"
          prerelease=""; [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" release/* \
            --draft $prerelease \
            --title "PRIVIA ${TAG#v}" \
            --notes-file "$notes"
