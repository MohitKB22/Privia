[package]
name = "privia"
version = "1.0.0"
description = "PRIVIA - Your space. Your intelligence."
authors = ["PRIVIA Contributors"]
license = "Apache-2.0"
repository = "https://github.com/MohitKB22/Privia"
edition = "2021"
rust-version = "1.77"

[lib]
name = "privia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
